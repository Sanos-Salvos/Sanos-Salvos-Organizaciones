server.port=8080
spring.application.name=organizaciones-service

spring.datasource.url=jdbc:postgresql://localhost:5432/organizaciones_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

resilience4j.circuitbreaker.instances.organizacionesCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.organizacionesCB.failure-rate-threshold=50