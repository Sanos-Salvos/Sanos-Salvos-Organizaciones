server.port=8081
spring.application.name=organizaciones-service

# PostgreSQL: Flexible para detectar el entorno (IntelliJ vs Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/organizaciones_db
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Kafka Producer: Flexible para local o contenedor
spring.kafka.producer.bootstrap-servers=${KAFKA_HOST:localhost}:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.organizacionesCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.organizacionesCB.failure-rate-threshold=50

# JWT
jwt.secret=sanosysalvos1234